<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Re:hear</title>
</head>

<body>
  <header>
        <!-- 8페이지에서 작성한 UX 계획 주석 -->

    <h1>발표 훈련 서비스</h1>
    <p>이 서비스는 사용자가 발표를 연습하고 피드백을 받을 수 있도록 도와줍니다.</p>
  </header>

  <h2> 서비스 소개 </h2>
  <h3> 완전한 환경에서 반복하는 발표 연습 </h3>

  <h2> 훈련 기능 </h2>
  <ul>
    <li>
      <h3>단계별 발표 연습</h3>
      <p>사용자는 자신의 발표를 녹음하고, 이를 반복적으로 연습할 수 있습니다.</p>
    </li>
    <li>
      <h3>가상 청중 연습</h3>
      <p>사용자는 가상의 청중을 만나서 발표를 연습할 수 있습니다.</p>
    </li>    
    <li>
      <h3>발표 피드백</h3>
      <p>사용자는 자신의 발표를 녹음하고, 이를 통해 피드백을 받을 수 있습니다. </p>
    </li>

  </ul>

</body>

</html>
